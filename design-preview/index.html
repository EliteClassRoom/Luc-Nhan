<style>

font-size:12px;font-weight:600}.listrow p{font-size:11px;color:var(--muted);margin-top:1px}.listrow .pill{margin-left:auto;white-space:nowrap}.empty{padding:21px 14px;border:1px dashed var(--line);border-radius:4px;margin:12px 0}.empty p{font-size:12px;color:var(--muted);margin-top:5px}.toolspage{display:flex;flex:1;min-height:0;flex-direction:column}.toolsbody{flex:1;overflow:auto;padding:12px 15px;min-height:0}.detail{border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:13px;background:var(--code)}.detail .label{margin-bottom:7px}.detail p{margin:5px 0}.footer-note{max-width:1100px;margin:13px auto 0;display:flex;gap:16px;font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid var(--accent);background:var(--surface);border-radius:5px;max-width:90vw;z-index:10}.review-mobile-nav{display:none}

@container (max-width:640px){.listrow .grow{display:block}.listrow .name{min-width:0}.listrow p{margin-top:2px}}

<body data-theme="dark">
<header class="reviewbar"><div class="reviewbrand">LUC NHAN <span class="muted">/ DESIGN REVIEW</span></div><div class="note small muted">Compact workspace · native Qt target</div><div class="reviewcontrols"><select id="mobile-view" class="review-mobile-nav" aria-label="Preview screen"></select><label>Dock<select id="dock"><option value="wide">Wide</option><option value="narrow">Narrow · 460 px</option></select></label><label>Theme<select id="review-theme"><option value="dark">Dark</option><option value="light">Light</option></select></label></div></header>
<div class="reviewlayout"><aside class="reviewnav" aria-label="Design screens" id="reviewnav"></aside><main class="reviewmain"><div class="intro"><div><h1 id="screen-title"></h1><p id="screen-description"></p></div><span class="screenlabel" id="screen-number"></span></div><section class="stage" id="stage" aria-label="Luc Nhan interface mockup"><div class="app" id="app"></div></section><div class="footer-note"><span>Design preview · synthetic sample data · no IDA/API connection</span><span>Navigation, expand/collapse, filtering and theme changes are interactive.</span></div></main></div><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const screens=[
 ['workspace','Workspace','Analysis first; compact tool rows and a full-width composer.','Workspace'],
 ['history','History','Session list appears only when requested; scoped to the current IDB.','Workspace'],
 ['mutations','Mutations','Database changes stay readable; undo is explicit and separate from navigation.','Workspace'],
 ['approval','Script approval','A visible decision gate with the complete script; no always-allow for Python.','Workspace'],
 ['provider','Provider','Connection, model and generation in one compact form; advanced behavior below.','Settings'],
 ['appearance','Appearance','Existing font and theme controls with an inline reading sample.','Settings'],
 ['skills','Skills','Compact enable/disable list grouped by source.','Settings'],
 ['mcp','MCP','Server configuration sources; no connections are made by this preview.','Settings'],
 ['profiles','Profiles','Redaction and denied-tool controls keep security settings discoverable.','Settings'],
 ['knowledge','Knowledge','Searchable table with a selected-record detail pane.','Tools'],
 ['agents','Agents','Running/completed agents in a dense table with output preview.','Tools'],
 ['a2a','A2A bridge','Agent selection, task composition and delegation history.','Tools']
];
let current='workspace';let previous='workspace';let toastTimer;
// Synthetic preview catalog, not capability metadata fetched from a provider.
const previewModels={
  'gpt-4.1':{levels:['none'],context:128000},
  'gpt-4.1-mini':{levels:['none'],context:128000},
  'o3-mini':{levels:['low','medium','high'],context:200000}
};
let selectedModel='gpt-4.1';
let selectedThinking='none';
const app=document.getElementById('app');
const button=(text,action,cls='')=>`<button class="${cls}" data-view="${action}">${text}</button>`;
const demo=(text,cls='')=>`<button class="${cls}" data-demo>${text}</button>`;
const check=(text,checked=true,disabled=false)=>`<label class="checkline"><input type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''}>${text}</label>`;
const field=(label,html)=>`<label>${label}</label>${html}`;
const input=(value,type='text',label='')=>`<input type="${type}" value="${value}" aria-label="${label||value}" ${type==='number'?'min="0"':''}>`;
const select=(items,label)=>`<select aria-label="${label}">${items.map(v=>`<option>${v}</option>`).join('')}</select>`;
const table=(headers,rows)=>`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function header(mode='Chat',state='Ready') {return `<header class="appheader"><div class="appbrand"><span class="brandmark" aria-hidden="true">六</span>Luc Nhan</div><span class="headerstate ${state==='Awaiting approval'?'warning':'success'}"><span class="dot"></span><span class="statetext">${state}</span></span><nav class="appnav" aria-label="Plugin navigation">${button('Chat','workspace',mode==='Chat'?'selected':'')}${button('Tools','knowledge',mode==='Tools'?'selected':'')}${button('History','history','secondary '+(current==='history'?'selected':''))}${button('Settings','provider','secondary '+(mode==='Settings'?'selected':''))}<details class="overflow navmore"><summary aria-label="More navigation">⋯</summary><div class="navmenu">${button('History','history')}${button('Settings','provider')}${button('Mutations','mutations')}${demo('Export chat')}</div></details></nav></header>`;}
function statusbar(){
  const editable=['workspace','history','mutations','approval'].includes(current);
  const model=editable?`<details class="model-picker"><summary id="model-trigger" aria-label="Change model and thinking level"><span id="model-summary" class="ellipsis">OpenAI / ${selectedModel}</span><span id="thinking-summary" class="thinking-badge">${selectedThinking==='none'?'Thinking off':selectedThinking}</span><span class="muted" aria-hidden="true">⌃</span></summary><div class="model-menu" role="group" aria-labelledby="model-menu-title"><h3 id="model-menu-title">Model &amp; thinking</h3><div class="field"><label for="quick-model">Model</label><select id="quick-model"></select></div><div class="field"><label for="quick-thinking">Thinking level</label><select id="quick-thinking"></select></div><p id="thinking-hint" class="inline-note"></p><p class="inline-note">Sample catalog · changes apply only to this preview.</p></div></details>`:`<span class="ellipsis">OpenAI / ${selectedModel}</span>`;
  return `<footer class="statusbar">${model}<span class="right" data-context-usage>18.4k / ${previewModels[selectedModel].context/1000}k</span><span class="usage" style="--usage:${18400/previewModels[selectedModel].context*100}%" aria-label="Illustrative context usage"></span><span class="hide-narrow">Sample IDB</span></footer>`;
}
function refreshModelControls(){
  const levels=previewModels[selectedModel].levels;
  document.querySelectorAll('#quick-model,.settingsbody select[aria-label="Model"]').forEach(e=>{
    e.innerHTML=Object.keys(previewModels).map(id=>`<option value="${id}">${id}</option>`).join('');
    e.value=selectedModel;
  });
  document.querySelectorAll('#quick-thinking,.settingsbody select[aria-label="Thinking level"]').forEach(e=>{
    e.innerHTML=levels.map(level=>`<option value="${level}">${level==='none'?'Off · not supported':level[0].toUpperCase()+level.slice(1)}</option>`).join('');
    e.value=selectedThinking;
    e.disabled=levels.length===1&&levels[0]==='none';
  });
  const summary=document.getElementById('model-summary');
  if(summary)summary.textContent=`OpenAI / ${selectedModel}`;
  const thinking=document.getElementById('thinking-summary');
  if(thinking)thinking.textContent=selectedThinking==='none'?'Thinking off':selectedThinking[0].toUpperCase()+selectedThinking.slice(1);
  const hint=document.getElementById('thinking-hint');
  if(hint)hint.textContent=levels[0]==='none'?'This sample model has no adjustable thinking level.':'Choose the reasoning effort for the selected sample model.';
  const usage=document.querySelector('[data-context-usage]');
  if(usage)usage.textContent=`18.4k / ${previewModels[selectedModel].context/1000}k`;
  document.querySelector('.usage')?.style.setProperty('--usage',`${18400/previewModels[selectedModel].context*100}%`);
}

rs','Info','Debug'],'Output verbosity'))}${field('Max agents',input('4','number','Maximum concurrent agents'))}${check('Run agents in parallel across tabs',false)}${check('Show loading indicator during retries')}${check('Preserve full context',false)}${check('Hide strings from analysis',false)}</div></details>`)+`<section class="section" id="glm-controls" hidden><div class="divider"></div><div class="sectionhead"><h3>GLM reasoning</h3></div><div class="checks">${check('Preserve thinking content')}${check('Degeneration guard')}</div><div class="formgrid">${field('Endpoint',select(['Standard API','Coding Plan'],'GLM endpoint'))}${field('Reasoning ceiling',input('8192','number','Reasoning ceiling'))}${field('Recovery token cap',input('4096','number','Recovery token cap'))}</div></section>`;}
