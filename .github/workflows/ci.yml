name: CI

on:
  # Cover fork default branch (master) + inherited upstream branches
  # (main, dev) so PRs to master actually trigger checks — previously
  # pushes to master silently skipped CI. See AGENTS.md §"CI trigger drift".
  pull_request:
    branches: [master, main, dev]
  # Catch direct pushes to default branches as a safety net (no
  # required-PR workflow on this repo, so accidental force-push to
  # master bypasses review).
  push:
    branches: [master, main, dev]

# Cancel stale runs when new commits land on the same branch.
# Without this, every force-push spawns a parallel run that wastes
# CI minutes and floods the PR / commit with notifications.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Pinned to the version in uv.lock: an unpinned ``pip install ruff``
      # drifts ahead of the dev environment and reformats files that
      # ``ruff format`` locally leaves alone (or vice versa), so the gate
      # fails for a version skew instead of a real style violation.
      - name: Install ruff
        run: pip install ruff==0.16.10

      - name: Format check
        run: python -m ruff format --check lucnhan/

      - name: Lint
        # Explicity lint the test suite too so `extend-include` in
        # pyproject.toml actually gates tests/ — `ruff check lucnhan/`
        # (explicit path) bypasses the default include set.
        run: python -m ruff check lucnhan/ tests/  # config in pyproject.toml

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install mypy tomli

      - name: Type check (core + providers + memory + ui)
        # `[tool.mypy].files` declares `lucnhan/memory` and `lucnhan/ui`;
        # the explicit path list keeps the CI gate stable regardless of
        # mypy's follow-imports default. The pre-existing memory/ui errors
        # that previously forced a deferral (report.py __iter__,
        # repository.py status Literal, model_picker.py QEvent.key, …)
        # have been fixed, so the full gate is enabled.
        run: python -m mypy lucnhan/core lucnhan/providers lucnhan/memory lucnhan/ui

  test:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # pyproject.toml advertises both 3.11 and 3.12 support. Run pytest
    # on both Python versions and on Ubuntu + Windows. The plugin runs
    # primarily inside IDA Pro on Windows, so a Windows run is required
    # to catch path/Qt native issues (e.g. the STATUS_STACK_BUFFER_OVERRUN
    # fast-fail that only reproduces on Windows). Lint and typecheck stay
    # on 3.11 (single stable tool version), and desloppify stays on 3.11
    # to keep its objective score reproducible (see AGENTS.md §"Note —
    # Python version and desloppify scores").
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev tools
        run: pip install pytest tomli pytest-timeout

      # Tests import lucnhan.ui.* which imports PySide6 at module
      # level (subject to Shiboken UAF on Python 3.13+ — see
      # lucnhan_plugin.py docstring). PySide6 + a subset of runtime
      # deps are required for the headless tests; the heavy ones
      # (anthropic, openai, ...) are mock-stubbed via tests/mocks/.
      - name: Install runtime + test deps
        run: |
          pip install -r requirements.txt
          pip install PySide6

        # PySide6's Qt libraries link libEGL/libGL at import time. Without
        # them every test module that imports lucnhan.ui.* dies during
        # collection with "ImportError: libEGL.so.1", which hides the real
        # test results behind an import failure. Ubuntu-only (Windows/Mac
        # bundle Qt runtime with PySide6 wheels).
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Run tests
        run: python -m pytest --tb=short -q

  quality:
    name: Desloppify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # bandit is not a desloppify dependency: without it the `security` detector
      # skips Python checks entirely and the PR security gate below passes vacuously.
      - name: Install desloppify
        run: pip install desloppify bandit

      - name: Run objective scan
        run: desloppify scan --profile objective --no-badge

      - name: Score regression gate
        run: |
          python -c "
          import json, sys

          try:
              data = json.load(open('.desloppify/query.json'))
              score = float(data.get('objective_score', 0))
          except Exception:
              print('Could not read desloppify score — failing safe')
              sys.exit(1)

          BASELINE = 89.0
          TOLERANCE = 0.5

          if score < BASELINE - TOLERANCE:
              sys.exit(f'Score {score}/100 is below baseline {BASELINE} (tolerance {TOLERANCE}) — fix before merging')
          print(f'OK — objective score {score}/100 (baseline {BASELINE})')
          "

      - name: Get changed Python files
        id: changed
        # Run on PRs (diff vs merge base) and on push (diff vs the commit
        # the push replaced). On push the merge base is undefined, so we
        # use `github.event.before`; this is the failsafe the old
        # PR-only guard skipped for direct pushes/force-pushes to master.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py' > /tmp/changed_files.txt
          else
            git diff --name-only ${{ github.event.before }}...HEAD -- '*.py' > /tmp/changed_files.txt
          fi
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Gate on security findings in changed files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          python -c "
          import json, subprocess, sys

          changed = [l.strip() for l in open('/tmp/changed_files.txt') if l.strip()]
          if not changed:
              print('No Python files changed — skipping security gate')
              sys.exit(0)

          findings = []
          for f in changed:
              result = subprocess.run(
                  ['desloppify', 'show', f, '--output', '/tmp/file_findings.json', '--status', 'open'],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  print(f'Warning: desloppify show failed ({result.returncode}) for {f} — skipping file')
                  continue
              try:
                  data = json.load(open('/tmp/file_findings.json'))
                  file_findings = data if isinstance(data, list) else (data.get('findings', []) if isinstance(data, dict) else [])
                  findings.extend(file_findings)
              except (json.JSONDecodeError, FileNotFoundError):
                  print(f'Warning: could not parse desloppify findings for {f} — skipping file')

          if not findings:
              print(f'OK — no open findings in {len(changed)} changed file(s)')
              sys.exit(0)

          security = [f for f in findings if f.get('detector') == 'security']
          other    = [f for f in findings if f.get('detector') != 'security']

          for f in security:
              print(f\"SECURITY: {f.get('file')} — {f.get('message', f.get('id', '?'))}\")
          for f in other[:5]:
              print(f\"  {f.get('detector')}: {f.get('file')} — {f.get('message', f.get('id', '?'))}\")

          if security:
              sys.exit(f'{len(security)} security finding(s) in your changed files — fix before merging')

          print(f'Advisory: {len(other)} non-security finding(s) in changed files (not blocking)')
          "

  # Single gate job — mark this as a required status check in branch protection
  gate:
    name: CI Gate
    if: always()
    needs: [lint, typecheck, test, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint:      ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "quality:   ${{ needs.quality.result }}"

          if [[ "${{ needs.lint.result }}" != "success" ]] ||
             [[ "${{ needs.typecheck.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.quality.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
