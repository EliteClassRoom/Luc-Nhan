[project]
name = "lucnhan"
version = "1.14.1"
description = "Agentic LLM reverse-engineering companion embedded directly in IDA Pro."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "buzzer-re" }]
keywords = [
  "ai",
  "llm",
  "agent",
  "reverse-engineering",
  "decompiler",
  "claude",
  "openai",
  "gemini",
  "ollama",
  "mcp",
  "ida",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Disassemblers and Examiners",
]

# Runtime dependencies — kept in sync with ``ida-plugin.json``'s ``pythonDependencies``.
# IDA Pro installs these via pip when the plugin loads; listing them here also lets
# ``uv sync`` provision a working dev environment for provider/agent tests.
dependencies = [
  "anthropic>=0.125.0",
  "openai>=2.0.0",
  "google-genai>=2.0.0",
  "mcp>=1.28.0",
  "ida-domain>=0.5.0",
  "tomli>=2.4.1",
  "cryptography>=49.0.0",
  "requests>=2.34.2",
  "html2text>=2025.4.15",
  "markdown-it-py>=4.2.0",
  "portalocker>=4.1.0,<5",
  "unicorn>=2.1.4,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 120

# The whole suite lives under the top-level ``tests/`` tree, which sits
# outside ``lucnhan/``; it needs an explicit ``extend-include`` so that
# ``ruff check`` (no args) and ``ruff check .`` from the project root
# lint it alongside the package.
#
# Note: the CI workflow currently invokes ``ruff check lucnhan/``, which
# passes an explicit path and bypasses the default include set.  To
# gate the top-level ``tests/`` suite in CI, that command needs to
# become ``ruff check .`` (or ``ruff check lucnhan/ tests/``).  This
# config change is the prerequisite for that follow-up — without it,
# widening the CI command would silently lint the repo's vendored
# stubs and tooling scripts too.
extend-include = ["tests/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"lucnhan/ida/**" = ["F401"]
"lucnhan/core/sanitize.py" = ["RUF003"]
"lucnhan/ui/plan_view.py" = ["RUF001"]
# The exploration-mode prompt embeds an en-dash (U+2013) in a numeric
# range.  Test fixtures (``tests/ida/test_evidence_comment.py``) assert
# on this exact glyph, so replacing it would break the contract.
"lucnhan/agent/exploration_mode.py" = ["RUF001"]
# ``tests/**`` files intentionally bootstrap ``sys.path`` and the IDA/Qt
# stub modules before importing the package under test (see e.g.
# ``tests/a2a/test_dispatcher.py``).  The resulting non-top-of-file
# imports are a structural requirement, not a mistake — silencing E402
# here avoids 160+ ``# noqa: E402`` lines that would otherwise drown out
# the real E-rule violations.
"tests/**" = ["E402"]
# ``tests/core/test_sanitize.py`` is the homoglyph test fixture — it
# embeds Cyrillic/Greek look-alike characters as **input data** that
# ``sanitize()`` is expected to detect.  Ruff cannot distinguish
# "ambiguous unicode as documentation hint" from "ambiguous unicode
# in a test payload", so we silence RUF001/RUF002/RUF003 at the file
# level rather than peppering test cases with ``# noqa``.
"tests/core/test_sanitize.py" = ["RUF001", "RUF002", "RUF003"]
# Same logic as test_sanitize: this file checks that the evidence-
# comment merge helper passes through an en-dash (U+2013) verbatim,
# matching the prompt literal in ``exploration_mode.py``.
"tests/ida/test_evidence_comment.py" = ["RUF001"]
# The plan_view tests assert that ``setText`` is called with a
# Unicode minus sign (U+2212) — a deliberate glyph choice that
# ruff otherwise flags as ambiguous.
"tests/tools/test_plan_view.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_error_summary = true

# Modules covered by `mypy` when invoked without explicit paths (e.g.
# via ``./ci-local.sh`` or editor integration).  The GitHub Actions job
# still pins ``mypy lucnhan/core lucnhan/providers`` for stability —
# update that command alongside this list to actually gate these layers.
files = [
  "lucnhan/memory",
  "lucnhan/ui",
]

# Strict type checking for the security-critical core and provider layers.
[[tool.mypy.overrides]]
module = ["lucnhan.core.*", "lucnhan.providers.*"]
disallow_untyped_defs = true

# Modules that depend on dynamic ``importlib.import_module`` of optional
# IDA / Qt C-extension packages.  mypy cannot resolve attributes on a
# value typed ``Any | None`` that came from ``importlib.import_module``,
# so these modules produce unavoidable false positives.  We silence the
# noise so the real errors in the rest of the tree remain visible.
#
# To audit: each override is paired with a comment explaining *why* it
# is necessary.  Removing an override without addressing the underlying
# Shiboken-safe import pattern will re-introduce ~450 errors.
[[tool.mypy.overrides]]
# IDA type-inf / Hex-Rays APIs — loaded via ``importlib.import_module`` to
# avoid Shiboken UAF (see core/thread_safety.py docstring).
module = [
  "lucnhan.ida.tools.types_tools",
  "lucnhan.ida.tools.microcode_format",
  "lucnhan.ida.tools.microcode",
  "lucnhan.ida.tools.disassembly",
  "lucnhan.ida.tools.annotations",
  "lucnhan.ida.tools.xrefs",
  "lucnhan.ida.tools.decompiler",
  "lucnhan.ida.ui.panel",
  "lucnhan.ida.ui.actions",
  "lucnhan.ida.headless_bootstrap",
]
ignore_errors = true

[[tool.mypy.overrides]]
# PySide6 fallback layer — provides dummy classes when Qt is unavailable,
# and re-exports symbol names that may shadow earlier imports.
module = ["lucnhan.ui.qt_compat", "lucnhan.ui.message_widgets"]
ignore_errors = true

[[tool.mypy.overrides]]
# Qt widget files that use the standard PySide6 idiom
# ``parent: QWidget | None = None``.  mypy treats this default as
# incompatible because the parameter is declared ``QWidget``.  This
# is the recommended PySide6 pattern (allowing the widget to be a
# top-level window with no parent) and cannot be cleanly expressed
# without ignoring the module.
module = [
  "lucnhan.ui.chat_view",
  "lucnhan.ui.a2a_widget",
  "lucnhan.ui.session_controller_base",
  "lucnhan.ui.tool_widgets",
  "lucnhan.ui.panel_core",
  "lucnhan.ui.mutation_log_view",
  "lucnhan.ui.tools_panel",
  "lucnhan.ui.settings_dialog",
  "lucnhan.ui.plan_view",
  "lucnhan.ui.input_area",
  "lucnhan.ui.bulk_renamer",
  "lucnhan.ui.agent_tree",
  "lucnhan.ui.context_bar",
  "lucnhan.ui.theme.manager",
  "lucnhan.ui.theme.palette_ida",
  "lucnhan.ui.tabs.skills_tab",
  "lucnhan.ui.tabs.profiles_tab",
  "lucnhan.ui.tabs.mcp_tab",
  "lucnhan.ida.ui.tools_form",
  "lucnhan.ida.tools.registry",
  "lucnhan.tools.web_fetch",
  # NOTE (task-7 r1, against reviewer recommendation): both modules
  # DO surface errors when mypy follows imports into them — the
  # reviewer claim of "0 errors" was verified empirically as referring
  # to a ``--follow-imports=skip`` / isolated-file analysis, not the
  # ``mypy lucnhan/memory lucnhan/ui`` invocation that the new
  # ``[tool.mypy].files`` triggers.
  #
  # ``lucnhan.ui.knowledge_panel`` — 10 errors (mypy 2.3.1, default
  # ``--follow-imports=normal``):
  #   * 8× ``[attr-defined]`` on PySide6 enum-by-name accesses that
  #     the bundled stubs only expose via nested enum classes:
  #     ``QAbstractItemView.SelectRows`` (134),
  #     ``QAbstractItemView.SingleSelection`` (135),
  #     ``QAbstractItemView.NoEditTriggers`` (136),
  #     ``QHeaderView.ResizeToContents`` (140, 142-145),
  #     ``QHeaderView.Stretch`` (141).
  #   * 2× ``[union-attr]`` ``QLayout | None`` does not have attribute
  #     ``insertWidget`` (233).
  # The enum-by-name pattern is exactly the Shiboken stub gap the
  # task-7 brief listed as warranting an ``ignore_errors`` override.
  # The union-attr is the same ``parent: QWidget | None = None``
  # idiom the existing block already addresses for the other
  # ``lucnhan.ui.*`` modules.
  "lucnhan.ui.knowledge_panel",
  # ``lucnhan.ui.history_panel`` — 2 errors:
  #   * ``[operator]`` ``object`` not callable (750) — mypy cannot
  #     resolve that the dynamic ``_announcements_sink`` attribute is
  #     a callable.
  #   * ``[attr-defined]`` ``QFrame`` has no attribute
  #     ``_announcements_sink`` (753) — the attribute is injected at
  #     runtime by the Qt compat layer / a ``TYPE_CHECKING`` shim.
  # Same pattern as the other Qt classes in this block: an attribute
  # injected at runtime that mypy cannot see.
  "lucnhan.ui.history_panel",
]
ignore_errors = true

[[tool.mypy.overrides]]
# ``ida_tools/microcode_optim`` defines dynamic classes from
# user-supplied optimizer code via ``exec(compile(...))``.  The base
# classes cannot be resolved statically because IDA APIs are loaded
# via ``importlib.import_module``.
module = ["lucnhan.ida.tools.microcode_optim"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Per-test timeout was the goal here (see task 7 brief:
# ``test_height_cached_label`` mock-pollution flake is the canonical
# case the timeout guards against).  ``--timeout=30`` with the
# ``thread`` method cooperates with C-level waits via a watchdog
# thread, matching the suite's threading.Event + queue.Queue patterns.
#
# DEFERRED — the ``pytest-timeout`` plugin is not provisioned in CI.
# The workflow installs runtime deps via ``pip install -r
# requirements.txt`` and does not pull the ``dev`` dependency group,
# so ``addopts = ["--timeout=30", "--timeout-method=thread"]`` would
# fail every test job with ``unrecognized option: --timeout``.  The
# intended addopts line is left commented below; re-enable in a
# follow-up PR after either adding ``pytest-timeout`` to
# ``requirements.txt`` (runtime side) or installing the ``dev`` group
# from the CI workflow.
#
# addopts = ["--timeout=30", "--timeout-method=thread"]

[dependency-groups]
dev = [
  "desloppify>=1.0",
  "pyside6>=6.11.1",
  "pytest>=9.1.1",
  "pytest-cov>=5.0",
  "ruff>=0.16.6",
  "mypy>=2.3.0",
  "pyyaml>=6.0.3",
]
